<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>

    .pump { transform-box: view-box; transform-origin: 48px 26px; animation: press 1.8s ease-in-out infinite; }
    @keyframes press { 0%, 60%, 100% { transform: translateY(0); } 28% { transform: translateY(7px); } }
    .drop { opacity: 0; animation: drop 1.8s ease-in infinite; }
    @keyframes drop {
      0%, 22% { opacity: 0; transform: translateY(0); }
      30% { opacity: 1; }
      55% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 0; transform: translateY(14px); }
    }

  </style>
  <g stroke="#a87e46" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">

    <rect x="34" y="40" width="30" height="44" rx="9" fill="#8fa864"/>
    <rect x="43" y="30" width="12" height="12" rx="2" fill="#8fa864"/>
    <g class="pump">
      <rect x="39" y="22" width="18" height="8" rx="3" fill="#6f8f6a"/>
      <path d="M39 26h-8"/>
    </g>
    <circle class="drop" cx="30" cy="31" r="2.6" fill="#7fa8b8" stroke="none"/>
    <rect x="39" y="52" width="20" height="15" rx="3" fill="#fbf3e0"/>
    <path d="M43 59h12" stroke-width="2.4"/>
  </g>
</svg>
