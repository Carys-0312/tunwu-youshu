<svg xmlns="http://www.w3.org/2000/svg" width="390" height="240" viewBox="0 0 390 240" fill="none">
  <style>
    /* 货架上的东西各蹦各的：落地压扁、起跳拉长，相位错开，不会整齐划一地起跳 */
    .hop,
    .bob {
      transform-box: view-box;
    }

    .hop {
      animation: hop 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .bob {
      animation: bob 3s ease-in-out infinite;
    }

    .tilt {
      animation-name: hop-tilt;
    }

    /* 箱顶那排离标题近，跳矮一点，矮屏也不会顶到字 */
    .soft {
      animation-name: hop-soft;
    }

    .s1 { animation-duration: 2.2s; animation-delay: -0.15s; }
    .s2 { animation-duration: 2.5s; animation-delay: -1.1s; }
    .s3 { animation-duration: 2.35s; animation-delay: -0.7s; }
    .s4 { animation-duration: 3.1s; animation-delay: -1.6s; }
    .s5 { animation-duration: 2.6s; animation-delay: -0.45s; }
    .s6 { animation-duration: 3.4s; animation-delay: -2.1s; }
    .s7 { animation-duration: 2.45s; animation-delay: -1.35s; }

    @keyframes hop {
      0%, 12% { transform: translateY(0) scale(1.08, 0.9); }
      26% { transform: translateY(-9px) scale(0.96, 1.06); }
      40% { transform: translateY(-18px) scale(1, 1); }
      52% { transform: translateY(0) scale(1.1, 0.88); }
      62% { transform: translateY(-5px) scale(0.98, 1.02); }
      72%, 100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes hop-soft {
      0%, 12% { transform: translateY(0) scale(1.07, 0.91); }
      26% { transform: translateY(-6px) scale(0.96, 1.05); }
      40% { transform: translateY(-12px) scale(1, 1); }
      52% { transform: translateY(0) scale(1.09, 0.89); }
      62% { transform: translateY(-4px) scale(0.98, 1.02); }
      72%, 100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes hop-tilt {
      0%, 12% { transform: translateY(0) rotate(0deg) scale(1.08, 0.9); }
      26% { transform: translateY(-9px) rotate(-6deg) scale(0.97, 1.05); }
      40% { transform: translateY(-17px) rotate(5deg) scale(1, 1); }
      52% { transform: translateY(0) rotate(0deg) scale(1.1, 0.88); }
      62% { transform: translateY(-5px) rotate(-2deg) scale(1, 1); }
      72%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hop,
      .bob {
        animation: none;
      }
    }
  </style>

  <!-- 一排囤货箱，箱顶再摞点货 -->
  <g stroke="#a87e46" stroke-width="1.15" stroke-linejoin="round">
    <rect x="-20" y="168" width="104" height="72" rx="4" fill="#d3ae72"/>
    <rect x="-20" y="159" width="104" height="9" fill="#efd9ad"/>

    <rect x="76" y="178" width="76" height="62" rx="4" fill="#d8b478"/>
    <rect x="76" y="169" width="76" height="9" fill="#eed9ac"/>

    <rect x="146" y="186" width="70" height="54" rx="4" fill="#d3ae72"/>
    <rect x="146" y="177" width="70" height="9" fill="#efd9ad"/>

    <rect x="210" y="174" width="78" height="66" rx="4" fill="#d7b77f"/>
    <rect x="210" y="165" width="78" height="9" fill="#f2dfb8"/>

    <rect x="282" y="166" width="112" height="74" rx="4" fill="#d3ae72"/>
    <rect x="282" y="157" width="112" height="9" fill="#efd9ad"/>
  </g>

  <!-- 箱顶的货：泡面、牛奶、酱油瓶、卷纸、青苹果，各有各的颜色 -->
  <g stroke="#a87e46" stroke-width="1.15" stroke-linejoin="round">
    <!-- 两摞泡面：下面金黄，上面暖红 -->
    <g class="hop soft s1" style="transform-origin: 32px 159px">
      <rect x="8" y="145" width="48" height="14" rx="4" fill="#e0b25c"/>
      <path d="M9 150h46" stroke-width="1"/>
      <rect x="14" y="131" width="36" height="14" rx="4" fill="#d9705c"/>
      <path d="M15 136h34" stroke="#fbf3e0" stroke-width="1.4"/>
    </g>

    <!-- 牛奶盒：奶油色盒身 + 湖蓝屋顶和标签 -->
    <g class="hop soft s2" style="transform-origin: 109px 169px">
      <path d="M94 136h30l-4 33h-22z" fill="#f2d9ab"/>
      <rect x="91" y="129" width="36" height="8" rx="3" fill="#7fa8b8"/>
      <rect x="98" y="145" width="22" height="8" rx="2" fill="#7fa8b8"/>
      <path d="M102 157l3-4 3 4 3-4 3 4" fill="none" stroke-width="1"/>
    </g>

    <!-- 酱油瓶：琥珀色瓶身、深棕瓶盖、奶油标签 -->
    <g class="hop soft s3" style="transform-origin: 240px 165px">
      <rect x="232" y="126" width="16" height="6" rx="2" fill="#8a5a2a"/>
      <path d="M234 132h12v11l5 6v16h-22v-16l5-6z" fill="#c98f4e"/>
      <rect x="229" y="147" width="20" height="12" rx="2" fill="#fbf3e0"/>
      <path d="M233 153h12" stroke="#7c3229" stroke-width="1.4"/>
    </g>

    <!-- 卷纸：三卷轻轻上下浮动 -->
    <g class="bob s4" style="transform-origin: 335px 166px">
      <circle cx="322" cy="153" r="13" fill="#f4e8cc"/>
      <circle cx="322" cy="153" r="4" fill="#d8b58a"/>
      <circle cx="349" cy="153" r="13" fill="#f4e8cc"/>
      <circle cx="349" cy="153" r="4" fill="#d8b58a"/>
      <circle cx="335" cy="131" r="13" fill="#f4e8cc"/>
      <circle cx="335" cy="131" r="4" fill="#d8b58a"/>
    </g>

    <!-- 青苹果：见缝插针地蹦一下，带一点歪头 -->
    <g class="hop tilt s7" style="transform-origin: 178px 186px">
      <circle cx="178" cy="176" r="10" fill="#9bb488"/>
      <path d="M178 165v-3" stroke="#8a5a2a" stroke-width="1.2"/>
      <path d="M179 166c4-5 9-5 11-2-3 4-8 5-11 2z" fill="#6f8f6a"/>
    </g>
  </g>

  <!-- 最前排：购物纸袋、果酱罐 -->
  <g stroke="#a87e46" stroke-width="1.15" stroke-linejoin="round">
    <!-- 纸袋跟着呼气一样轻抬，别把「囤」晃花 -->
    <g class="bob s6" style="transform-origin: 31px 240px">
      <path d="M22 196v-9c0-6 19-6 19 0v9" fill="none"/>
      <path d="M13 196h37l4 44H9z" fill="#e8cf9f"/>
      <text x="31" y="226" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#a87e46">
        囤
      </text>
    </g>

    <!-- 最前排右侧：一只小木箱，果酱罐搁在箱盖上 -->
    <g>
      <rect x="326" y="216" width="78" height="24" rx="3" fill="#c6a165"/>
      <rect x="323" y="209" width="84" height="7" rx="3" fill="#ecd9b2"/>
    </g>
    <g class="hop tilt s5" style="transform-origin: 369px 209px">
      <rect x="352" y="179" width="34" height="7" rx="3" fill="#ddbe8a"/>
      <path d="M355 186h28v13c0 3-2 5-5 5h-18c-3 0-5-2-5-5z" fill="#d9705c"/>
      <rect x="359" y="190" width="20" height="8" rx="2" fill="#fbf3e0"/>
    </g>
  </g>
</svg>
