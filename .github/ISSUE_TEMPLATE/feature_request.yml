name: 功能建议
description: 提出一个新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述 **使用场景和问题**，再谈具体方案。这样更容易判断这个建议是否适合放进路线图。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？现在的做法哪里不方便？
      placeholder: 例如：我一次买了很多冷冻食品，想按冰箱分区记录……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 App 怎么表现？可以画草图或描述交互
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅客户端（本仓库可实现）
        - 需要服务端配合（不在本仓库）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue 和 README 路线图
          required: true
